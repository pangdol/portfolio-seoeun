<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>관리자 | Portfolio</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* ===== 관리자 화면에만 쓰는 모양 (색·글꼴은 style.css 와 같음) ===== */
    /* 방문자 화면의 2칸 나누기를 관리자 상자에는 쓰지 않는다 */
    .sheet.admin-sheet {
      display: block;
    }

    .sheet.topbar {
      display: flex;
    }

    .admin-sheet {
      padding: 40px 48px;
      margin-bottom: 24px;
    }

    .hidden {
      display: none !important;
    }

    .topbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      padding: 20px 28px;
      margin-bottom: 24px;
    }

    .topbar .big-title {
      margin: 0;
      font-size: 24px;
    }

    .topbar .who {
      margin-left: auto;
      font-size: 14px;
      color: var(--muted);
    }

    .topbar a {
      font-size: 14px;
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .login-box {
      max-width: 420px;
      margin: 10vh auto 0;
    }

    .field {
      display: block;
      margin-bottom: 14px;
    }

    .field > span {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    .field input[type="text"],
    .field input[type="email"],
    .field input[type="password"],
    .field textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }

    .field small {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0 20px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    .btn {
      padding: 10px 20px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      font-weight: 700;
      cursor: pointer;
    }

    .btn.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #ffffff;
    }

    .btn.danger {
      color: var(--danger);
    }

    .section-head .btn {
      white-space: nowrap;
    }

    .btn.small {
      padding: 6px 12px;
      font-size: 13px;
      border-radius: 10px;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .msg {
      min-height: 1.6em;
      margin: 10px 0 0;
      font-size: 14px;
      color: var(--accent);
    }

    .msg.error {
      color: var(--danger);
    }

    /* 사진·파일 고르는 칸 */
    .upload {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .preview {
      width: 96px;
      height: 96px;
      border-radius: 18px;
      background: var(--placeholder);
      overflow: hidden;
      flex: none;
    }

    .preview.wide-preview {
      width: 160px;
      height: 100px;
      border-radius: 10px;
    }

    .preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .file-name {
      font-size: 13px;
      color: var(--muted);
      word-break: break-all;
    }

    .file-name a {
      color: var(--accent);
    }

    /* 카드 목록 */
    .rows {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .rows > li {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 0;
      border-top: 1px solid var(--line);
    }

    .rows .thumb {
      width: 88px;
      height: 56px;
      border-radius: 8px;
      background: var(--placeholder);
      overflow: hidden;
      flex: none;
    }

    .rows .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .rows .info {
      flex: 1;
      min-width: 0;
    }

    .rows .info strong {
      display: block;
    }

    .rows .meta {
      font-size: 12px;
      font-weight: 700;
      color: var(--accent);
    }

    .rows .sub {
      font-size: 13px;
      color: var(--muted);
      word-break: break-word;
    }

    .rows .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: flex-end;
    }

    .like-count {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .edit-box {
      margin-top: 24px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 20px;
    }

    .edit-box h3 {
      margin: 0 0 16px;
      font-size: 17px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-head .big-title {
      margin: 0;
    }

    @media (max-width: 820px) {
      .admin-sheet {
        padding: 28px 20px;
      }

      .section-head .big-title {
        font-size: 24px;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .rows > li {
        flex-wrap: wrap;
      }

      .rows .actions {
        width: 100%;
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="page">

    <!-- ===== 로그인 화면 ===== -->
    <section class="sheet admin-sheet login-box hidden" id="login-view">
      <h1 class="big-title">관리자 로그인</h1>
      <label class="field">
        <span>이메일</span>
        <input type="email" id="login-email" autocomplete="username">
      </label>
      <label class="field">
        <span>비밀번호</span>
        <input type="password" id="login-password" autocomplete="current-password">
      </label>
      <button type="button" class="btn primary" id="login-button">로그인</button>
      <p class="msg" id="login-msg"></p>
    </section>

    <!-- ===== 관리자가 아닐 때 ===== -->
    <section class="sheet admin-sheet login-box hidden" id="denied-view">
      <h1 class="big-title">관리자만 쓸 수 있어요</h1>
      <p class="intro">이 계정은 관리자로 등록되어 있지 않아요.</p>
      <button type="button" class="btn" id="denied-logout">로그아웃</button>
    </section>

    <!-- ===== 관리자 화면 ===== -->
    <div class="hidden" id="admin-view">

      <header class="sheet topbar">
        <h1 class="big-title">관리자</h1>
        <span class="who" id="who"></span>
        <a href="index.html" target="_blank" rel="noopener">방문자 화면 보기</a>
        <button type="button" class="btn small" id="logout-button">로그아웃</button>
      </header>

      <!-- 프로필 -->
      <section class="sheet admin-sheet">
        <h2 class="big-title">프로필</h2>

        <div class="field">
          <span>프로필 사진</span>
          <div class="upload">
            <div class="preview" id="photo-preview"></div>
            <div>
              <input type="file" id="photo-file" accept="image/png,image/jpeg,image/webp,image/gif">
              <div class="buttons">
                <button type="button" class="btn small danger" id="photo-remove">사진 빼기</button>
              </div>
              <small class="file-name">PNG·JPG·WEBP·GIF, 10MB까지. 고르면 바로 올라가고 저장돼요.</small>
            </div>
          </div>
          <p class="msg" id="photo-msg"></p>
        </div>

        <div class="form-grid">
          <label class="field"><span>이름</span><input type="text" id="pf-name"></label>
          <label class="field"><span>직함</span><input type="text" id="pf-title"></label>
          <label class="field"><span>경력 배지</span><input type="text" id="pf-career_badge"></label>
          <label class="field"><span>이메일</span><input type="text" id="pf-email"></label>
          <label class="field"><span>연락처</span><input type="text" id="pf-phone"></label>
          <label class="field"><span>위치</span><input type="text" id="pf-location"></label>
          <label class="field wide">
            <span>한 줄 소개 제목</span><input type="text" id="pf-headline">
            <small>이 안에 이름이 들어 있으면 방문자 화면에서 이름에 초록 밑줄이 생겨요.</small>
          </label>
          <label class="field wide"><span>소개 글</span><textarea id="pf-intro"></textarea></label>
          <label class="field"><span>EDUCATION</span><textarea id="pf-education"></textarea></label>
          <label class="field"><span>SKILLS &amp; TOOLS</span><textarea id="pf-skills"></textarea></label>
          <label class="field wide"><span>EXPERIENCE</span><textarea id="pf-experience"></textarea></label>
          <label class="field wide"><span>맨 아래 한 줄 인용</span><input type="text" id="pf-quote"></label>
        </div>

        <button type="button" class="btn primary" id="profile-save">프로필 저장</button>
        <p class="msg" id="profile-msg"></p>
      </section>

      <!-- 포트폴리오 카드 -->
      <section class="sheet admin-sheet">
        <div class="section-head">
          <h2 class="big-title">포트폴리오 카드</h2>
          <button type="button" class="btn primary small" id="project-new">+ 카드 추가</button>
        </div>
        <ul class="rows" id="project-list"><li class="status">불러오는 중…</li></ul>
        <p class="msg" id="project-list-msg"></p>

        <div class="edit-box hidden" id="project-form">
          <h3 id="project-form-title">카드 추가</h3>
          <div class="form-grid">
            <label class="field"><span>번호</span><input type="text" id="pj-number" placeholder="예: 01"></label>
            <label class="field"><span>분류</span><input type="text" id="pj-category"></label>
            <label class="field wide"><span>제목 (꼭 적기)</span><input type="text" id="pj-title"></label>
            <label class="field wide"><span>설명</span><textarea id="pj-description"></textarea></label>
            <label class="field wide">
              <span>태그</span><input type="text" id="pj-tags" placeholder="예: 총괄 PM, UI/UX">
              <small>쉼표(,)로 나눠 적어요.</small>
            </label>

            <div class="field wide">
              <span>썸네일 이미지</span>
              <div class="upload">
                <div class="preview wide-preview" id="pj-thumb-preview"></div>
                <div>
                  <input type="file" id="pj-thumb-file" accept="image/png,image/jpeg,image/webp,image/gif">
                  <div class="buttons">
                    <button type="button" class="btn small danger" id="pj-thumb-remove">썸네일 빼기</button>
                  </div>
                  <small class="file-name">PNG·JPG·WEBP·GIF, 10MB까지</small>
                </div>
              </div>
            </div>

            <div class="field wide">
              <span>첨부 파일 (카드를 누르면 열리는 파일)</span>
              <input type="file" id="pj-file-file" accept="image/png,image/jpeg,image/webp,image/gif,application/pdf">
              <div class="buttons">
                <button type="button" class="btn small danger" id="pj-file-remove">첨부 파일 빼기</button>
              </div>
              <small class="file-name" id="pj-file-name">없음</small>
              <small class="file-name">PDF·이미지, 10MB까지. 없으면 카드를 눌렀을 때 썸네일이 열려요.</small>
            </div>
          </div>
          <p class="msg" id="pj-upload-msg"></p>

          <div class="buttons">
            <button type="button" class="btn primary" id="project-save">카드 저장</button>
            <button type="button" class="btn" id="project-cancel">취소</button>
          </div>
          <p class="msg" id="project-msg"></p>
        </div>
      </section>

      <!-- 좋아요 -->
      <section class="sheet admin-sheet">
        <h2 class="big-title">좋아요</h2>
        <ul class="rows" id="like-list"><li class="status">불러오는 중…</li></ul>
        <p class="msg" id="like-msg"></p>
      </section>

      <!-- 방명록 -->
      <section class="sheet admin-sheet">
        <h2 class="big-title">방명록</h2>
        <ul class="rows" id="guest-admin-list"><li class="status">불러오는 중…</li></ul>
        <p class="msg" id="guest-msg"></p>
      </section>

    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
